        "story": "I cried last time I played The Last Of Us 2. It was during the museum sequence, where there are dinosaurs and explanations about space exploration.\nI love stories about space conquest, and each time I hear the countdown before launching a spacecraft, I cry (just thinking of it, I have tears in my eyes haha), and I don't really know why.\nAt the end of the scene (warning! tiny spoiler of the scene here), Joël gives Ellie an audiotape she listen while she's installed in a space capsule. We can hear Apollo 11 launching countdown, so I just couldn't resist, the scene was emotionally too strong for me (also for other reasons I won't give here to avoid too much spoil 😅).",

        "story": "god i cry all the time it turns out! i'm rubbish at processing emotions and then they turn into tears before i know what to do with myself\n\nthe last time i shed a tear was literally watching the WWE when it was at london - i was so overwhelmed with joy watching everyone having a good time and was imagining how amazing it must have felt for the wrestlers to feel all that emotion from the crowd\n\nthe last time i properly sad cried was a few weeks ago finding out my mum had cancer - i was imagining how scared she must feel (my dad also died from a really agressive cancer 15 years ago) so i was also thinking of the sadness around that - it's looking really positive but i'm still sad for her having to deal with that \n\ni mostly cry whilst picturing or imagining other peoples emotions tbf",

        "story": "The last time I cried was from fear. I have musculoskeletal problems, sometimes it hurts to do my job or my hobbies. Whenever I am feeling well, a phase of pain comes back to stop me. I have to walk a fine line of work hard through pain - without doing too much - to become healthy again. Sometimes I doubt I will ever get better and, think that I have no capacity to adapt. Then I have to cry. I am an ugly crier, so when someone sees me cry, I feel that I must apologize. It hurts. I'm scared. Will everything be ok? I am sorry.",
        "details": "Ruth, 40 "

    {
        "story": "Voglio condividere cosa mi è successo oggi con un monaco buddista al tempio in Tailandia.È stato stranissimo,lui era seduto e c'era una ragazza del luogo inginocchiata davanti a lui e lui non guarda negli occhi a nessuno,e io ero in un angolo a guardare, lui mi vede e dice qualcosa alla ragazza che si allontana e mi fa cenno di avvicinarmi  io mi inginocchio e ho sentito una botta dentro e lui senza guardami mi ha fatto cenno di allungare la mano e mi ha messo un filo intorno al polso e ha inchinato la testa. Mi sono allontanata piangendo a singhiozzi per parecchio tempo.\n--------------------------------------------------------------------------------\nI want to share what happened with a buddhist monk in Thailand last week. It was very strange. A monk was sitting in the temple and there was a local woman kneeling next to him. He wasn’t looking at any one. I was in a corner looking and he sees me and tells something to the local woman who then comes over to me and tells me to get closer to the monk. I kneel down in front of the monk and feel a strong sensation like a punch in the guts. The monk without looking at me indicates to me to extend my arm and puts a thread bracelet around my wrist and bows his head. I moved away crying and sighing for a very long time.\n",
        "details": "Antonella, 62 "
    },
    {
        "story": "The most memorable time I cried was after I left visiting my mum once.\n\nShe lived alone in what had been our family house. My father had left her a few years previously, and my siblings and I were grown up and had moved out.\n\nMy mum was starting to deteriorate from a degenerative neurological disease and was not really managing living in a house that was too big for her.\n\nMy partner and I lived nearby and frequently visited her to help her.\n\nWe had just visited for several hours to try to help sort out the house, and help her prepare to move to a smaller, more manageable place. (Looking back now I am proud we helped her move: she was much happier in the smaller place.)\n\nMum had always been strong-headed (a.k.a. determined a.k.a. stubborn) (at least since my dad left), but her illness meant she could get confused, angry and aggressive. The visit had been very, very difficult. My partner and I had received abuse for really trying to help, in spite all our efforts to be compassionate. \n\nWe had just left. I was driving, Within a mile of the house I had to pull up on a dual carriage hard shoulder. I burst into tears and sobbed uncontrollable for several minutes, struggling to catch my breath. My nerves were wracked.\n\nIn that situation - and in many situations that followed in the years we took care of mum before she passed away - I knew mum loved me, she knew I was helping, but she was not capable of not becoming angry and defensive because she was ill. It made taking care of her very difficult.\n\nShe passed away three years ago last week. She was 67. Looking back at the 9 years my partner and I took care of my mum, I am so proud of what we were able to do for her. It was the hardest, most important thing I have ever done.\n\nI treasure the time I had with her in the last years. The difficult times - like this time I cried on the hard shoulder of the dual carriage way after leaving her house - make to good times we shared all the more precious.",

        "story": "I cry all the time, because I'm tired, because I'm sad, because I'm in pain, because I'm frustrated or angry... Unfortunately I have chronic conditions that mean I experience pain and fatigue, and my interactions with the NHS cause anger and frustration! But happily, the last time I cried was because I read a passage that touched me: \"We have many devices to protect ourselves from sadness - naturally enough it is a distressing feeling... And yet sadness... is a very noble feeling if we bear it with dignity... To try to run away from the awareness of the pain of sadness is tantamount to thinking of light without shadow, or love without the anxiety of possible separation, of life without death.\"",

        "story": "I always cry in movies or books where a pet dies. There is something so pure about this love that a pet disappearing feels too sad.",
        "details": "Andreia, 43 "

function fetchStories() {
    const storiesList = document.getElementById('stories-list');
    if (stories.length === 0) {
        storiesList.innerHTML = 'No stories available';
        return;
    }
    storiesList.innerHTML = '';
    stories.forEach(story => {
        storiesList.appendChild(storyElement(story));
    });
}

function storyElement(story) {
    const maxLength = 550;
    const cutLength = 350;
    const element = document.createElement('div');
    element.classList.add('story');
    let content = story.story;
    let hasMore = false;
    if (content.length > maxLength) {
        let i = cutLength;
        while (content[i] != ' ' && i < content.length) i++;
        content = content.slice(0,i);
        hasMore = true;
    }
    if (!hasMore) {
        const contentElement = document.createElement('p');
        contentElement.innerText = story.story;
        const detailsElement = document.createElement('div');
        detailsElement.classList.add('story-details');
        detailsElement.innerText = story.details;
        element.appendChild(contentElement);
        element.appendChild(detailsElement);
        return element;
    }

    const contentElement = document.createElement('p');
    contentElement.innerText = content + '...';
    let shortened = true;
    const readMoreElement = document.createElement('a');
    readMoreElement.innerText = 'read more';
    readMoreElement.addEventListener('click', () => {
        if (shortened) {
            contentElement.innerText = story.story;
            readMoreElement.innerText = 'read less';
            shortened = false;
        } else {
            contentElement.innerText = content + '...';
            readMoreElement.innerText = 'read more';
            shortened = true;
        }
    })

    const detailsElement = document.createElement('div');
    detailsElement.classList.add('story-details');
    detailsElement.innerText = story.details;
    
    element.appendChild(contentElement);
    element.appendChild(readMoreElement);
    element.appendChild(detailsElement);
    return element;
}

setTimeout(fetchStories, 500);
